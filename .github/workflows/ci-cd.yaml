name: CI-CD

on:
  push:
    branches:
      - main

jobs:
  check_build_push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6
      
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - run: docker build -t ghcr.io/romgzn/echo-api:latest .

      - run: docker push ghcr.io/romgzn/echo-api:latest
